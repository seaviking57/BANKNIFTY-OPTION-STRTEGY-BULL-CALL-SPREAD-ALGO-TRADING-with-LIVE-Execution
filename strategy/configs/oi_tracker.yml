# Default configuration for the OI Tracker Strategy
default:
  # -- General Settings --
  underlying_instrument: 'NIFTY' # Can be 'NIFTY' or 'BANKNIFTY'
  update_interval_seconds: 60    # How often to refresh the data (in seconds)

  # -- Strike Price Selection --
  # How many strike prices to show above and below the At-The-Money (ATM) strike
  # For example, num_strikes_above_atm: 2 will show ATM+1 and ATM+2
  num_strikes_above_atm: 2
  num_strikes_below_atm: 2

  # -- Time Intervals for OI Change --
  # These are the columns in the table, showing change over these periods.
  time_intervals_minutes: [3, 5, 10, 15, 30, 180] # 180 minutes = 3 hours

  # -- Color Coding Thresholds --
  # The cell will be colored red if the percentage change in OI exceeds the threshold for that time interval.
  # Format: {time_interval_in_minutes: percentage_threshold}
  color_thresholds:
    3: 10.0   # > 10% change in 3 mins
    5: 12.0   # > 12% change in 5 mins
    10: 15.0  # > 15% change in 10 mins
    15: 30.0  # This was listed as 3 mins in the prompt, corrected to 15
    30: 30.0  # > 30% change in 30 mins
    180: 100.0 # > 100% change in 3 hours

  # -- Alert Settings --
  # An alert sound will be played if the percentage of colored cells in any table exceeds this value.
  alert_threshold_percentage: 30.0
  alert_sound_file: 'alert.wav' # A path to a .wav or .mp3 file to play for alerts